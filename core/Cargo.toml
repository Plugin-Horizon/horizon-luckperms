[package]
name = "horizon-luckperms-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "LuckPerms-compatible permissions for Horizon servers: data model, resolution, MariaDB storage and SQL messaging"

# Only crates that Horizon's Cargo.lock already holds (docs/native-mods.md, "The mod's crate").
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
getrandom = "0.3"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# MariaDB client, blocking; the features horizon-mod-deps names for mods.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"], optional = true }

# ureq as the other ports use it (skinsrestorer); flate2 (already in Horizon's lock) for the gzip bytebin takes.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[features]
default = ["mysql", "net"]
mysql = ["dep:mysql"]
# The web editor's HTTP (bytebin).
net = ["dep:ureq", "dep:flate2"]
