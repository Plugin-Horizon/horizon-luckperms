[mod]
id = "luckperms"
version = "0.1.0"

# Written blind against an older Horizon revision; re-pinned to main for the plan (see STATUS.md).
[compatibility]
horizon_revision = "b13dbf0687b545431172466ab4b91d19c3976405"
# The permission, command-level and commands-sent-v2 hooks are on Horizon main (checked in native_hooks.rs).

# Model, resolution, in-memory storage and /lp (MariaDB dropped: mysql is not in Horizon's Cargo.lock). The helpers below only hand it
# players, commands and ticks.
[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# Server start: read config/luckperms.toml, open the database, load groups and tracks.
[[injection]]
id = "start"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_about_to_start"
helper = "glue/start.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Orderly stop: the worker finishes its queue (and sends a pending update ping).
[[injection]]
id = "stop"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_stopping"
helper = "glue/stop.rs"
bindings = []

# Each tick: the players' levels, dimensions and game modes to the cache; /lp answers and log
# notifications out; config/luckperms.toml reloaded when saved; queued console commands run.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "glue/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# A player was accepted: save their name to the players table and load their data.
[[injection]]
id = "login"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_login"
helper = "glue/login.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# Placed in the world: their contexts are known from now on.
[[injection]]
id = "logged-in"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_in"
helper = "glue/logged_in.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
]

[[injection]]
id = "logout"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_out"
helper = "glue/logout.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

# /lp and its aliases, for everyone (level 0): /lp checks luckperms.* itself.
[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "glue/register.rs"
bindings = [{ name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" }]

[[injection]]
id = "perform"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "glue/perform.rs"
bindings = [
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

[[injection]]
id = "console"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_console_command"
helper = "glue/console.rs"
bindings = [{ name = "command", ty = "&str", value = "command" }, { name = "ran", ty = "&mut bool", value = "ran" }]

# Every typed command: refused when its node (minecraft.command.<name>) is false. The grant side
# needs a Horizon hook (GAPS.md); `grant-via-execute` is the stopgap.
[[injection]]
id = "command-gate"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_command"
helper = "glue/command_gate.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "command", ty = "&str", value = "command" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
  { name = "replies", ty = "&mut Vec<horizon_client::text::Text>", value = "replies" },
]

# The command tree a player gets: refused commands leave it.
[[injection]]
id = "commands-sent"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_commands_sent"
helper = "glue/commands_sent.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }, { name = "names", ty = "&mut Vec<String>", value = "names" }]

# Completion of /lp's arguments.
[[injection]]
id = "tab-complete"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tab_complete"
helper = "glue/tab_complete.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "command", ty = "&str", value = "command" },
  { name = "suggestions", ty = "&mut Vec<horizon_client::mod_api::Suggestion>", value = "suggestions" },
]

# Permission nodes for everyone (hooks-all, #10504): every mod's and the server's
# `native_has_permission` asks LuckPerms first.
[[injection]]
id = "permission-check"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_permission_check"
helper = "glue/permission_check.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "node", ty = "&str", value = "node" },
  { name = "result", ty = "&mut Option<bool>", value = "result" },
]

# A granted vanilla command runs at the level it needs.
[[injection]]
id = "command-level"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_command_level"
helper = "glue/command_level.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "level", ty = "&mut u8", value = "level" },
]

# Granted roots shown in the command tree (Paper's PlayerCommandSendEvent after the check).
[[injection]]
id = "commands-sent-v2"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_commands_sent_v2"
helper = "glue/commands_sent_v2.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "names", ty = "&mut Vec<String>", value = "names" },
  { name = "names_hidden", ty = "&mut Vec<String>", value = "names_hidden" },
]
